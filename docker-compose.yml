version: '3.8'

services:
  mlflow:
    # Substitua a imagem por uma versão estável
    image: ghcr.io/mlflow/mlflow:latest
    container_name: recommender_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    command: >
      mlflow server 
      --backend-store-uri sqlite:////mlflow.db 
      --default-artifact-root /mlruns 
      --host 0.0.0.0 
      --port 5000

  recommender_app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: recommender_app
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - mlflow
    # Comando para permitir que o DVC e scripts rode, mantendo o container vivo
    tty: true
    stdin_open: true
    command: /bin/bash