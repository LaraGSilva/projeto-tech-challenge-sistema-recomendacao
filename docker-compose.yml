services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: recommender_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_SERVER_ALLOWED_HOSTS=* 
    command: >
      mlflow server 
      --backend-store-uri sqlite:////mlflow.db 
      --default-artifact-root /mlruns 
      --host 0.0.0.0 
      --port 5000
      --allowed-hosts "*"

  recommender_app:
    build: .
    container_name: recommender_app
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://recommender_mlflow:5000
    tty: true
    stdin_open: true
    command: tail -f /dev/null
    # Adicione a seção abaixo:
    deploy:
      resources:
        limits:
          memory: 4g