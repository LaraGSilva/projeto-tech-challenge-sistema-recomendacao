services:
  # 1. Serviço de MLflow para rastreamento de experimentos
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: recommender_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db  
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    command: >
      mlflow server 
      --backend-store-uri sqlite:////mlflow.db 
      --default-artifact-root /mlruns 
      --host 0.0.0.0 
      --port 5000
      --allowed-hosts "*"

  # 2. Aplicação principal (API + Treino)
  recommender_app:
    build: .
    container_name: recommender_app
    ports:
      - "8000:8000"
    volumes:
      # Monta o projeto inteiro para acesso ao código e aos modelos gerados
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://recommender_mlflow:5000
      # PYTHONPATH=/app garante que o Python encontre os módulos na raiz
      - PYTHONPATH=/app
      # Caminhos dos artefatos lidos pelo service_wrapper e pelos scripts
      - MODEL_PATH=/app/models/neumf_model.pth
      - MAPPINGS_PATH=/app/models/mappings.npy
    tty: true
    stdin_open: true
    # O comando abaixo mantém o container rodando para você executar comandos manuais,
    # mas você pode trocar para: command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    command: tail -f /dev/null
    deploy:
      resources:
        limits:
          memory: 4g