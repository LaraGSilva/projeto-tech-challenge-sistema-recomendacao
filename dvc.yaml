stages:
  # ==========================================
  # STAGE 1: Geração de Features
  # ==========================================
  build_features:
    cmd: python scripts/build_features_local.py
    deps:
      - scripts/build_features_local.py
      - data/interim/events.csv
    outs:
      - data/features/user_item_matrix.npz
      - data/features/mappings.pkl

  # ==========================================
  # STAGE 2: Treinamento dos Baselines (Scikit-Learn)
  # ==========================================
  train_baselines:
    cmd: python src/recommender/models/train_baselines.py
    deps:
      - src/recommender/models/train_baselines.py
      - src/recommender/evaluation/evaluate.py
      - data/features/user_item_matrix.npz
      - data/features/mappings.pkl
    outs:
      - models/baselines/

  # ==========================================
  # STAGE 3: Treinamento da Rede Neural (PyTorch)
  # ==========================================
  train_neural:
    # O script neural lê os dados interim e salva registros no MLflow/Model Registry
    cmd: python -c "from src.recommender.models import train_neural; train_neural.main()"
    deps:
      - src/recommender/models/train_neural.py
      - src/recommender/evaluation/evaluate.py
      - data/interim/events.csv
      - data/interim/item_properties_part1.csv
      - data/interim/item_properties_part2.csv
    # O MLflow registra o modelo, então não há 'outs' obrigatórios de arquivo, 
    # mas o DVC monitora a execução do código.