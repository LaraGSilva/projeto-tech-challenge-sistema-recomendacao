stages:
  build_features:
    cmd: python -m scripts.build_features_local
    deps:
      - shared/data/data_csv/raw/events.csv
      - scripts/build_features_local.py
    outs:
      - data/features/mappings.pkl
      - data/features/user_item_matrix.npz

  train_baselines:
    cmd: python -m training.train_baselines
    deps:
      - data/features/mappings.pkl
      - data/features/user_item_matrix.npz
      - shared/ml/evaluate_metrics.py
      - training/train_baselines.py
    outs:
      - models/baselines/

  train_neural:
    cmd: python -m training.train
    deps:
      - shared/data/data_csv/raw/events.csv
    outs:
      - models/neural/
